name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:unit

      - name: Start PostgreSQL + LocalStack
        run: docker compose up -d --wait postgres localstack

      - name: Integration + concurrency tests (real PostgreSQL and SQS)
        run: bun run test:integration

      - name: Start 3 replicas
        run: docker compose up -d --build --wait app

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: E2E tests against the 3 replicas (Playwright)
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-report

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
